name: PlatformIO CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Start the release steps with v1.0.0, v2.1.0, etc.
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    - name: Run PlatformIO Compile
      run: pio run

      
    # -- get test artifacts for testing --
    - name: Upload Test Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Beta-Test-Firmwares
        path: |
          .pio/build/viditel-modem-emulator/firmware.bin
          .pio/build/m2009-emulator/firmware.uf2


    # -- prepare release files for tagged releases --
    - name: Prepare Release Files
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir release_files
        cp .pio/build/viditel-modem-emulator/firmware.bin release_files/viditel-modem-emulator.bin
        cp .pio/build/m2009-emulator/firmware.uf2 release_files/m2009-emulator.uf2
        cp src/ftpclient/ftp-client.cas release_files/ftp-client.cas

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_files/viditel-modem-emulator.bin
          release_files/m2009-emulator.uf2
          release_files/ftp-client.cas
        generate_release_notes: true

    - name: Prepare Web Flasher Files
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        mkdir gh_pages_files
        cp -r webflasher/* gh_pages_files/
        cp .pio/build/viditel-modem-emulator/bootloader.bin gh_pages_files/
        cp .pio/build/viditel-modem-emulator/partitions.bin gh_pages_files/
        cp .pio/build/viditel-modem-emulator/firmware.bin gh_pages_files/viditel-modem-emulator.bin

        VERSION=${GITHUB_REF#refs/tags/}
        cat <<EOF > gh_pages_files/manifest.json
        {
          "name": "Viditel Modem Emulator (ESP32-WROOM-DA)",
          "version": "$VERSION",
          "new_install_prompt_erase": true,
          "builds": [
            {
              "chipFamily": "ESP32",
              "parts": [
                { "path": "bootloader.bin", "offset": 4096 },
                { "path": "partitions.bin", "offset": 32768 },
                { "path": "viditel-modem-emulator.bin", "offset": 65536 }
              ]
            }
          ]
        }
        EOF

    - name: Deploy to GitHub Pages
      if: startsWith(github.ref, 'refs/tags/')
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh_pages_files
        keep_files: true