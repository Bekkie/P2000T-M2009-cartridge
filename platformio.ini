[platformio]
default_envs = ftpclient, viditel-modem-emulator, m2009-emulator
src_dir = src
lib_dir = src/lib

[env]
framework = arduino
monitor_speed = 115200
lib_deps = 
     bblanchon/ArduinoJson @ ^7.0.0
     densaugeo/base64 @ ~1.4.0

build_flags = -D APP_VERSION=\"\\\"\"$UNIX_TIME\"\\\"\" -D GIT_VERSION=\"\\\"\"`git describe --tags --always`\"\\\"\"

[env:ftpclient]
platform = native
framework =
lib_deps =
lib_ldf_mode = off
extra_scripts = pre:src/tools/build_p2000t.py
build_src_filter = -<*>

[env:viditel-modem-emulator]
platform = espressif32
board = esp32dev
board_build.partitions = min_spiffs.csv
build_src_filter = +<viditel-modem-emulator/**>
build_flags = -I src/viditel-modem-emulator -D VIEWDATAEMULATOR

[env:m2009-emulator]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
extra_scripts = pre:src/tools/build_p2000t.py
build_src_filter = +<m2009-emulator/**>
build_flags = -I src/m2009-emulator -D M2009EMULATOR